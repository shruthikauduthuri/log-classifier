services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      FLASK_ENV: development
      ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "5001:5001"

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:5001
    ports:
      - "5173:5173"
    depends_on:
      - backend
